[project]
name = "shellllm"
version = "0.2.0"
description = "Local-LLM helpers for zsh: ',' proposes commands, '?' answers questions."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "François Chastel", email = "francois@chastel.co" }]
requires-python = ">=3.10"
keywords = ["llm", "zsh", "shell", "llama-cpp", "qwen", "local-ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "httpx>=0.27",
    "rich>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-requests",
]

[project.scripts]
shellllm-comma = "shellllm.comma:main"
shellllm-ask = "shellllm.ask:main"
shellllm-recall = "shellllm.recall:main"

[project.urls]
Homepage = "https://github.com/FrancoisChastel/shellllm"
Issues = "https://github.com/FrancoisChastel/shellllm/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shellllm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PTH", # use pathlib over os.path
]
ignore = [
    "E501",  # line too long — ruff format handles it
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018"]  # don't complain about useless attribute accesses in tests

[tool.mypy]
python_version = "3.10"
files = ["src/shellllm"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
# We're a CLI app, not a library — `disallow_untyped_defs` would be too
# noisy given how much zsh-shaped string slinging the code does. Start
# with the "catch real bugs" subset and tighten over time.
warn_unreachable = true
no_implicit_optional = true
check_untyped_defs = true
# httpx ships types; rich does too. No need to install stubs.

[[tool.mypy.overrides]]
# Tests use a lot of monkeypatching with Any-shaped fakes; not the
# place to fight types.
module = "tests.*"
ignore_errors = true
